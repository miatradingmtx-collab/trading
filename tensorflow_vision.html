<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MIA - Matriz Profunda (TensorFlow)</title>
    <style>
        body { margin: 0; padding: 0; background-color: #040609; color: #fff; font-family: "Courier New", Courier, monospace; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; padding: 20px; box-sizing: border-box; }
        .hud-box { background: rgba(10, 15, 25, 0.8); border: 1px solid rgba(0, 255, 163, 0.3); padding: 15px; border-radius: 8px; backdrop-filter: blur(5px); }
        h1 { color: #00ffa3; font-size: 24px; margin: 0 0 10px 0; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 255, 163, 0.5); }
        .stats { font-size: 12px; color: #8892b0; line-height: 1.8; }
        .stat-value { color: #e6f1ff; font-weight: bold; }
        .log-container { position: absolute; bottom: 20px; left: 20px; width: 400px; height: 150px; overflow-y: hidden; }
        .log-entry { font-size: 11px; margin-bottom: 5px; opacity: 0.8; }
        .log-entry.TIDAL { color: #00ffa3; }
        .log-entry.LUMEN { color: #fbbf24; }
        .log-entry.ZEPHR { color: #34d399; }
        .log-entry.NORO { color: #ff6a00; }
        .log-entry.RUNE { color: #ef4444; }
    </style>
</head>
<body>
<div id="canvas-container">
    <canvas id="netCanvas"></canvas>
</div>
<div id="ui-layer">
    <div class="hud-box" style="width: 320px;">
        <h1>TENSORFLOW CORE</h1>
        <div class="stats">
            <div>STATUS: <span class="stat-value" id="tf-status" style="color:#00ffa3">EN L?NEA (SHADOW TRADING)</span></div>
            <div>MODELO: <span class="stat-value">Sequential (Keras)</span></div>
            <div>PRECISI?N (ACC): <span class="stat-value">0.75</span></div>
            <div>CAPAS OCULTAS: <span class="stat-value">Dense, Dropout</span></div>
            <div>?LTIMA PREDICCI?N: <span class="stat-value" id="tf-pred">ESPERANDO TICK...</span></div>
        </div>
    </div>
    <div class="hud-box log-container" id="logBox">
        <div style="font-size: 10px; color: #ff6a00; margin-bottom: 8px;">> TERMINAL DE NEURONAS</div>
    </div>
</div>
<script>
    const canvas = document.getElementById("netCanvas");
    const ctx = canvas.getContext("2d");
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resize); resize();
    const layers = [6, 8, 8, 4];
    const nodes = [];
    const links = [];
    const startX = window.innerWidth * 0.2;
    const endX = window.innerWidth * 0.8;
    const gapX = (endX - startX) / (layers.length - 1);
    const centerY = window.innerHeight / 2;
    layers.forEach((count, layerIndex) => {
        const gapY = window.innerHeight * 0.6 / count;
        const startY = centerY - (count * gapY) / 2 + gapY / 2;
        for (let i = 0; i < count; i++) {
            nodes.push({ x: startX + layerIndex * gapX, y: startY + i * gapY, layer: layerIndex, activation: Math.random(), targetActivation: Math.random() });
        }
    });
    for (let l = 0; l < layers.length - 1; l++) {
        const currentLayerNodes = nodes.filter(n => n.layer === l);
        const nextLayerNodes = nodes.filter(n => n.layer === l + 1);
        currentLayerNodes.forEach(n1 => { nextLayerNodes.forEach(n2 => { links.push({ source: n1, target: n2, weight: Math.random() * 2 - 1, active: false }); }); });
    }
    function draw() {
        ctx.fillStyle = "#040609"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        nodes.forEach(n => { n.activation += (n.targetActivation - n.activation) * 0.05; if (Math.random() < 0.01) n.targetActivation = Math.random(); });
        links.forEach(l => {
            ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y);
            let alpha = 0.2 + Math.abs(l.weight) * 0.4; if (l.active) alpha = 1.0;
            if (l.weight > 0) ctx.strokeStyle = "rgba(180, 0, 255, " + alpha + ")";
            else ctx.strokeStyle = "rgba(239, 68, 68, " + alpha + ")";
            ctx.lineWidth = l.active ? 3 : 1.0; ctx.stroke();
            if (l.active && Math.random() < 0.1) l.active = false;
        });
        nodes.forEach(n => {
            ctx.beginPath(); ctx.arc(n.x, n.y, 4 + n.activation * 3, 0, Math.PI * 2);
            const r = Math.floor(n.activation * 180); const g = Math.floor(n.activation * 0); const b = Math.floor(n.activation * 255);
            ctx.fillStyle = "rgb(" + r + ", " + g + ", " + b + ")";
            ctx.shadowBlur = 15 * n.activation; ctx.shadowColor = ctx.fillStyle; ctx.fill(); ctx.shadowBlur = 0;
        });
        requestAnimationFrame(draw);
    }
    draw();
    function triggerPulse(isBullish) {
        links.forEach(l => { if (Math.random() < 0.3) { l.active = true; l.weight = isBullish ? Math.abs(l.weight) : -Math.abs(l.weight); } });
        nodes.forEach(n => n.targetActivation = 1.0);
    }
    const wsUrl = (window.location.protocol === "https:" ? "wss:" : "ws:") + "//" + window.location.host + "/ws";
    const ws = new WebSocket(wsUrl);
    const logBox = document.getElementById("logBox");
    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.type === "HEARTBEAT") return;
            const agent = data.agent || "SYSTEM"; const msg = data.msg || data.data || data.texto;
            triggerPulse(msg.includes("Alcista") || Math.random() > 0.5);
            if (agent === "ZEPHR") document.getElementById("tf-pred").innerText = "PROCESANDO PROBABILIDAD...";
            else if (agent === "RUNE") document.getElementById("tf-pred").innerText = msg.includes("APROBADO") ? "ALTA (LONG)" : "BAJA (VETO)";
            const entry = document.createElement("div");
            entry.className = "log-entry " + agent;
            entry.innerText = "[" + agent + "] " + msg;
            logBox.appendChild(entry);
            if (logBox.children.length > 8) logBox.removeChild(logBox.children[1]);
        } catch (e) { console.error("Error WS:", e); }
    };
    ws.onopen = () => { console.log("Cerebro TensorFlow Conectado."); };
    ws.onclose = () => { document.getElementById("tf-status").innerText = "DESCONECTADO - REINTENTANDO..."; document.getElementById("tf-status").style.color = "red"; };
</script>
</body>
</html>
